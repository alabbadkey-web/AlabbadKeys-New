name: تطبيق تحديث 16.9.1

# مهمة لمرة واحدة: تطبّق تعديل الكود الجاهز ثم تشغّل البناء.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: هل الأجزاء موجودة
        id: parts
        run: |
          if [ -f _apply/fix.part00 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: تطبيق تعديل الكود
        if: steps.parts.outputs.ok == 'true'
        run: |
          set -euo pipefail
          cat _apply/fix.part* | base64 -d | gunzip > /tmp/fix.patch
          if git apply --check --include=AlabbadKeys_New.py /tmp/fix.patch; then
            git apply --include=AlabbadKeys_New.py /tmp/fix.patch
            echo "تم تطبيق التعديل"
          else
            echo "التعديل مطبّق من قبل"
          fi
          python3 -c "compile(open('AlabbadKeys_New.py', encoding='utf-8').read(), 'AlabbadKeys_New.py', 'exec')"

      - name: حفظ الكود المعدّل
        if: steps.parts.outputs.ok == 'true'
        run: |
          set -euo pipefail
          git config user.name "alabbadkey-web"
          git config user.email "alabbadkey-web@users.noreply.github.com"
          git add AlabbadKeys_New.py
          if git diff --cached --quiet; then
            echo "لا يوجد تغيير جديد"
          else
            git commit -m "الإصدار 16.9.1: زر إصدار طلب النواقص PDF داخل شاشة طلب شراء من المورد"
            git push
          fi

      - name: تشغيل بناء البرنامج
        if: steps.parts.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml
