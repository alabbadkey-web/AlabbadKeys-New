name: Build and publish release

on:
  push:
    paths:
      - "**.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Find main script and version
        shell: pwsh
        run: |
          $f = Get-ChildItem -Recurse -Filter *.py | Where-Object { Select-String -Path $_.FullName -Pattern 'class App\(tk\.Tk\)' -Quiet } | Select-Object -First 1
          if (-not $f) { throw "Main program file was not found in the repository" }
          $m = Select-String -Path $f.FullName -Pattern 'APP_VERSION\s*=\s*"([^"]+)"' | Select-Object -First 1
          if (-not $m) { throw "APP_VERSION was not found in the main file" }
          $ver = $m.Matches[0].Groups[1].Value
          Write-Host "Main file: $($f.FullName)  Version: $ver"
          "SCRIPT=$($f.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "APP_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pdfplumber pillow certifi libsql

      - name: Build exe
        shell: pwsh
        run: |
          pyinstaller --onefile --windowed --name AlabbadKeys_New --collect-all pdfplumber --collect-all pdfminer --collect-all pypdfium2 --collect-all certifi --collect-all libsql "$env:SCRIPT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: v${{ env.APP_VERSION }}
          files: dist/AlabbadKeys_New.exe
