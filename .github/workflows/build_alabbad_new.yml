
name: Build Alabbad Keys New EXE

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify main script
        shell: pwsh
        run: |
          if (-not (Test-Path "AlabbadKeys_New.py")) {
            throw "AlabbadKeys_New.py was not found in the repository root"
          }

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade pyinstaller pdfplumber pdfminer.six pypdfium2 pillow
          python -m pip show pyinstaller pdfplumber pdfminer.six pypdfium2 pillow

      - name: Build new EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name AlabbadKeys_New `
            --collect-all pdfplumber `
            --collect-all pdfminer `
            --collect-all pypdfium2 `
            --hidden-import pdfplumber `
            --hidden-import pdfminer.high_level `
            --hidden-import pypdfium2 `
            "AlabbadKeys_New.py"

          if (-not (Test-Path "dist/AlabbadKeys_New.exe")) {
            throw "Build finished without creating dist/AlabbadKeys_New.exe"
          }

      - name: Upload new EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlabbadKeys_New_EXE
          path: dist/AlabbadKeys_New.exe
          if-no-files-found: error

